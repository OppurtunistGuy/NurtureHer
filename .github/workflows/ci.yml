name: Nocturne CI

on:
  push:
    branches: [UAT, main]
  pull_request:
    branches: [UAT, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nocturne-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require UAT promotion for production pull requests
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$PR_HEAD" = "UAT"
          test "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f branch=UAT -f event=push -f head_sha="$PR_HEAD_SHA" -f status=success \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length > 0' \
            | grep -qx true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and workflow tests
        run: npm test
      - name: Server route smoke tests
        run: npm run test:ssr
      - name: Production build
        run: npm run build
      - name: Package the tested build
        run: tar -czf nocturne-build.tar.gz .output
      - name: Upload the tested build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nocturne-${{ github.event.pull_request.head.sha || github.sha }}
          path: nocturne-build.tar.gz
          retention-days: 7
          if-no-files-found: error
